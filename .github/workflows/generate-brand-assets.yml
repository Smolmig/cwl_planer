name: Build brand icons from current SVG
on:
  push:
    branches: [main, fix/unified-brand-and-share]
    paths:
      - brand-mark.svg
      - scripts/generate-brand-assets.py
      - .github/workflows/generate-brand-assets.yml
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG render dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Rasterize current brand mark and link preview
        run: python scripts/generate-brand-assets.py
      - name: Commit generated images when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-icon-192.png brand-icon-512.png brand-social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Build unified PWA icons and social preview from gold brand"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
