name: Verify prior encrypted backup content (isolated drill)

# Run on an explicit helper edit in main (including the 13 Nov retry).
# The initial attempt hit a host-port collision at 54322; the reusable
# restore now chooses a free local port before it starts Docker.
# Follow-up retest: make the port available in its current shell as well.
# The explicitly selected 18 Nov 2026 backup was previously decryptable,
# but the first restore lacked newer Auth columns and the DDL workaround
# was blocked by Auth ownership. Re-test SAME ciphertext with CLI v3.2.0,
# which was independently verified to provide both columns (read-only gate).
# Later: operator may explicitly provide a different successful backup run.
# 19 Nov retry after PR #316: the runner now uses its preinstalled psql
# instead of depending on the Ubuntu package mirror. Replay the unchanged
# 18 Nov encrypted artifact in localhost only; require full SQL/CWL/Audit checks.
# No direct connection or writing to production Supabase is possible here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-encrypted-backup-drill.yml'
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Existing successful encrypted backup run ID (30-day artifact retention)'
        type: string
        required: true
        default: '44283214780'

permissions:
  contents: read
  actions: read

jobs:
  previous-backup-content-drill:
    if: ${{ github.repository == 'Smolmig/cwl_planer' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/test-encrypted-restore.yml
    with:
      # 18 November successful encrypted backup includes new source-tagged CW
      # incident decisions. Restore runs only against local temporary DB.
      # Workflow_dispatch allows choosing any newer successful run ID later.
      backup_run_id: ${{ github.event_name == 'push' && '44283214780' || inputs.backup_run_id }}
    secrets:
      CWL_BACKUP_PASSPHRASE: ${{ secrets.CWL_BACKUP_PASSPHRASE }}
