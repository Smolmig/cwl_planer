name: ClashPerk authenticated HTTP/RLS UAT
on:
  pull_request:
    paths:
      - 'scripts/DRAFT_cwl_clashperk_atomic_import_rpc.sql'
      - 'tests/sql/clashperk-http-setup.sql'
      - 'tests/clashperk-http-jwt-uat.test.cjs'
      - '.github/workflows/clashperk-http-jwt-uat.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/DRAFT_cwl_clashperk_atomic_import_rpc.sql'
      - 'tests/sql/clashperk-http-setup.sql'
      - 'tests/clashperk-http-jwt-uat.test.cjs'
      - '.github/workflows/clashperk-http-jwt-uat.yml'
permissions:
  contents: read
jobs:
  jwt-rest-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create synthetic app tenants, real stats RLS and DRAFT RPC
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/clashperk-atomic-import-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/DRAFT_cwl_clashperk_atomic_import_rpc.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/clashperk-http-setup.sql
      - name: Start isolated PostgREST (NO production Supabase credentials)
        run: |
          docker run --rm -d --network host --name clashperk-postgrest-test \
            -e PGRST_DB_URI='postgres://authenticator:synthetic-http-only@127.0.0.1:5432/postgres' \
            -e PGRST_DB_SCHEMAS='public' \
            -e PGRST_DB_ANON_ROLE='anon' \
            -e PGRST_JWT_SECRET='synthetic-clashperk-jwt-tests-only-secret-2026' \
            -e PGRST_SERVER_PORT='3000' \
            postgrest/postgrest:v16.5
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs clashperk-postgrest-test
          exit 1
      - name: Verify real HTTP JWT/RLS tenant isolation and rollback
        env:
          CWL_TEST_REST_URL: http://127.0.0.1:3000
          CWL_TEST_JWT_SECRET: synthetic-clashperk-jwt-tests-only-secret-2026
        run: node --test tests/clashperk-http-jwt-uat.test.cjs
      - name: Log isolated test server only on failure
        if: failure()
        run: docker logs clashperk-postgrest-test || true
      - name: Stop disposable server
        if: always()
        run: docker stop clashperk-postgrest-test || true
