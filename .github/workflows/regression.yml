name: CWL Planer regression
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: cwl-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Playwright 1.56.1 Chromium is not supported on ubuntu26.04-x64.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM test runtime
        run: npm install --no-save --no-package-lock jsdom@27 playwright@1.56.1
      - name: Install Chromium for responsive browser tests
        run: npx playwright install chromium
      - name: Verify syntax and planner regressions
        env:
          CWL_UX_SCREENSHOTS: ux-screenshots
        run: node --test tests/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-form-ux-screenshots
          path: ux-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
