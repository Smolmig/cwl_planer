name: Collect finished Clash war statistics
on:
  schedule:
    # Two staggered opportunities per hour; GitHub schedule remains best-effort.
    # Supabase internal Cron at :05/:35 is independent; retain strict OIDC as backup.
    # Gaps >3h cannot safely credit clan tenure/donation intervals.
    # Editing this cron also re-registers the GitHub schedule actor.
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-war-stats.yml'

permissions:
  contents: read
  id-token: write
concurrency:
  group: cwl-clash-stats-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Obtain short-lived GitHub workload identity
        id: oidc
        shell: bash
        env:
          COLLECT_AUDIENCE: cwl-stats-collector:yjldnvfwposfwmzmcsow
        run: |
          set -euo pipefail
          encoded="$(jq -nr --arg audience "$COLLECT_AUDIENCE" '$audience | @uri')"
          response="$(curl --fail --silent --show-error --max-time 12 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}")"
          jwt="$(jq -r '.value // empty' <<<"$response")"
          if [[ -z "$jwt" ]]; then
            echo "::error::GitHub OIDC token unavailable"
            exit 1
          fi
          echo "::add-mask::$jwt"
          echo "collector_jwt=$jwt" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GitHub identity claims before invoking the Edge Function
        shell: bash
        env:
          COLLECTOR_JWT: ${{ steps.oidc.outputs.collector_jwt }}
        run: |
          node --input-type=module <<'NODE'
          import {verifyCollectorIdentity,EXPECTED} from './supabase/functions/coc-stats-collector/collector-auth.mjs';
          const jwt=process.env.COLLECTOR_JWT;
          const [rawHead,rawClaims]=jwt.split('.');
          const header=JSON.parse(Buffer.from(rawHead,'base64url').toString('utf8'));
          const claims=JSON.parse(Buffer.from(rawClaims,'base64url').toString('utf8'));
          const checks={
            issuer:claims.iss===EXPECTED.issuer,
            audience:claims.aud===EXPECTED.audience,
            repository:claims.repository===EXPECTED.repository,
            repoId:String(claims.repository_id)===EXPECTED.repositoryId,
            ref:claims.ref===EXPECTED.ref,
            workflowRef:claims.workflow_ref===EXPECTED.workflowRef,
            sub:claims.sub===EXPECTED.subject,
            eventAllowed:['schedule','workflow_dispatch','push'].includes(claims.event_name),
            headerType:header.typ||'(absent)',
            algorithm:header.alg,
            lifetimeSeconds:claims.exp-claims.iat
          };
          console.log('OIDC public-claims verification:',JSON.stringify(checks));
          const valid=await verifyCollectorIdentity(jwt);
          console.log('Local signature+claims valid:',valid);
          if(!valid)process.exitCode=1;
          NODE

      - name: Collect stats for linked clans
        shell: bash
        env:
          COLLECTOR_JWT: ${{ steps.oidc.outputs.collector_jwt }}
          COLLECTOR_URL: https://yjldnvfwposfwmzmcsow.supabase.co/functions/v1/coc-stats-collector
        run: |
          set -euo pipefail
          # HTTP 200 alone is insufficient: partial roster responses used to pass
          # while silently leaving member-time and donation history empty.
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          http="$(curl --silent --show-error --max-time 170 --retry 1 --retry-delay 10 --output "$result_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer ${COLLECTOR_JWT}" --header "Content-Type: application/json" --data '{}' "$COLLECTOR_URL")"
          if [[ "$http" != "200" ]] || ! jq -e '.ok == true and (.tenantProfiles | type == "number" and . > 0) and .failedProfiles == 0 and .tenureWriteErrors == 0 and .tenureSkippedProfiles == 0 and .tenureObservedProfiles == .tenantProfiles' "$result_file" >/dev/null; then
            echo "::error::Collector coverage incomplete or HTTP $http; no historical time/donations inferred"
            # Response contains ONLY aggregate counts and allowlisted failure classes.
            jq -c '{ok,tenantProfiles,failedProfiles,tenureObservedProfiles,tenureSkippedProfiles,tenureWriteErrors,rosterFailureClasses}' "$result_file" || true
            exit 1
          fi
          jq -c '{tenantProfiles,tenureObservedProfiles,rosterFailureClasses}' "$result_file"
          echo "Protected collection completed with full roster coverage"
