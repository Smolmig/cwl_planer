name: Local Supabase Auth-schema compatibility UAT

on:
  pull_request:
    paths:
      - '.github/workflows/restore-local-auth-schema-ci.yml'
      - '.github/workflows/test-encrypted-restore.yml'
      - 'scripts/restore_local_auth_compat.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-local-auth-schema-ci.yml'
      - '.github/workflows/test-encrypted-restore.yml'
      - 'scripts/restore_local_auth_compat.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-schema-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORK: /tmp/cwl-auth-schema-canary
    steps:
      - uses: actions/checkout@v4
      # A hosted Auth schema updated after 2.122.0; verify a local v3.x
      # bootstrap BEFORE using it to restore an existing encrypted artifact.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Start disposable local Supabase PostgreSQL and verify Auth columns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cd "$WORK"
          supabase init --yes
          # v3.4 creates JSONC by default; keep the existing isolated TOML port editor.
          supabase config convert --to toml
          test -f supabase/config.toml
          restore_port="$(python3 - <<'PY'
          from pathlib import Path
          import re, socket
          config=Path('supabase/config.toml')
          lines=config.read_text().splitlines(keepends=True)
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              sock.bind(('127.0.0.1',0))
              port=sock.getsockname()[1]
          in_db=False
          matches=0
          for i,line in enumerate(lines):
              if line.lstrip().startswith('['):
                  in_db=line.strip()=='[db]'
              elif in_db and re.match(r'^\s*port\s*=\s*\d+',line):
                  lines[i]=re.sub(r'(port\s*=\s*)\d+',lambda m:m.group(1)+str(port),line,count=1)
                  matches+=1
          if matches!=1: raise SystemExit('Unable to isolate disposable DB port')
          config.write_text(''.join(lines))
          print(port)
          PY
          )"
          test -n "$restore_port"
          # CLI v3.4.0 defaults to GoTrue v2.198.0; v2.199.0 contains
          # upstream migration 20261116120000 for client_auth_method/audience.
          # The CLI's own legacy service-pin resolver reads this file before
          # its official one-shot Auth bootstrap. No project link or local DDL.
          export SUPABASE_EXPERIMENTAL_STACK=0
          mkdir -p supabase/.temp
          printf '%s' 'v2.199.0' > supabase/.temp/gotrue-version
          test "$(cat supabase/.temp/gotrue-version)" = 'v2.199.0'
          supabase db start
          # ubuntu-24.04 GitHub runners already include psql; avoid network-dependent apt.
          command -v psql >/dev/null 2>&1 || { echo '::error::PostgreSQL client unavailable on runner'; exit 1; }
          psql --version
          PGPASSWORD=postgres psql -X -q -h 127.0.0.1 -p "$restore_port" -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/scripts/restore_local_auth_compat.sql"
          echo 'PASS: local Auth schema compatibility gate'
      - name: Remove local DB and temporary test files
        if: always()
        shell: bash
        run: |
          export SUPABASE_EXPERIMENTAL_STACK=0
          if [[ -d "$WORK/supabase" ]]; then
            (cd "$WORK" && supabase stop --no-backup) || true
          fi
          rm -rf "$WORK"
