name: Test encrypted DB restore (isolated)

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Successful backup run ID (e.g. 41154402398)'
        type: string
        required: true
        default: '41154402398'

permissions:
  contents: read
  actions: read

jobs:
  restore-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK: /tmp/cwl-restore-check
    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted artifact (never access production database)
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Invalid run ID'; exit 1; }
          umask 077
          mkdir -p "$WORK/download" "$WORK/unpacked" "$WORK/local"
          gh run download "$BACKUP_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "cwl-encrypted-db-$BACKUP_RUN_ID" --dir "$WORK/download"
          (cd "$WORK/download" && sha256sum --check cwl-backup.tar.gz.gpg.sha256)

      - name: Decrypt and check archive contents (no plaintext in logs)
        shell: bash
        env:
          CWL_BACKUP_PASSPHRASE: ${{ secrets.CWL_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CWL_BACKUP_PASSPHRASE" ]] || { echo '::error::Passphrase secret missing'; exit 1; }
          printf '%s' "$CWL_BACKUP_PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt "$WORK/download/cwl-backup.tar.gz.gpg" 2>/dev/null |
            tar -xz --no-same-owner -C "$WORK/unpacked" -f -
          for required in roles.sql schema.sql data.sql auth-data.sql README.txt; do
            test -s "$WORK/unpacked/cwl-backup/$required" || { echo "::error::Missing $required"; exit 1; }
          done
          python3 scripts/verify_auth_dump.py "$WORK/unpacked/cwl-backup/auth-data.sql"
          echo 'Decryption and mandatory dump files verified.'

      - name: Confirm role dump is present (Supabase local roles are pre-provisioned)
        shell: bash
        run: |
          set -euo pipefail
          test -s "$WORK/unpacked/cwl-backup/roles.sql"
          echo 'Role dump present. Local Supabase initializes its own privileged roles.'
          echo 'Note: roles.sql will NOT be replayed in this local app-data restore test.'
          echo 'Full role migration is a separate unverified disaster-recovery step.'

      - name: Reconcile overlapping auth COPY sections in the two SQL exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re
          root = Path(os.environ['WORK']) / 'unpacked/cwl-backup'
          header = re.compile(
              r'^COPY\s+((?:"?[A-Za-z_][A-Za-z_0-9]*"?\.)?"?[A-Za-z_][A-Za-z_0-9]*"?)'
              r'\s+\(([^)]*)\)\s+FROM\s+stdin;\s*$', re.I)
          def load(path):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              info = {}
              sections = []
              i = 0
              while i < len(lines):
                  match = header.match(lines[i])
                  if not match:
                      i += 1
                      continue
                  table = match.group(1).replace('"', '').lower()
                  columns = re.sub(r'\s+', '', match.group(2)).lower()
                  start = i
                  i += 1
                  rows = []
                  while i < len(lines) and lines[i].rstrip('\r\n') != r'\.':
                      rows.append(lines[i])
                      i += 1
                  if i >= len(lines):
                      raise SystemExit(f'::error::Incomplete COPY block for {table}.')
                  i += 1
                  if table in info:
                      raise SystemExit(f'::error::Repeated COPY block for {table} inside one dump.')
                  fingerprint = hashlib.sha256(''.join(sorted(rows)).encode('utf-8')).hexdigest()
                  info[table] = (columns, len(rows), fingerprint)
                  sections.append((table, start, i))
              return lines, info, sections
          _, auth, _ = load(root / 'auth-data.sql')
          data_lines, data, data_sections = load(root / 'data.sql')
          assert 'auth.users' in auth, 'Separate auth export has no auth.users COPY'
          duplicated = auth.keys() & data.keys()
          for table in duplicated:
              if auth[table] != data[table]:
                  raise SystemExit(
                      f'::error::Overlapping auth data differs for {table}; restore aborted rather than lose records.')
          skip = set()
          for table, first, end in data_sections:
              if table in duplicated:
                  skip.update(range(first, end))
          (root / 'data-local.sql').write_text(
              ''.join(line for i, line in enumerate(data_lines) if i not in skip),
              encoding='utf-8')
          print(f'Auth consistency verified. Identical COPY blocks skipped from second dump: {len(duplicated)}.')
          print(f'Unique COPY blocks retained from data.sql: {len(data) - len(duplicated)}.')
          PY

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start disposable local Supabase Postgres
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK/local"
          supabase init --yes
          supabase db start
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -qAt -c 'SELECT 1' | grep -qx 1

      - name: Restore schema, auth data and app data in one transaction
        shell: bash
        run: |
          set -euo pipefail
          if ! PGPASSWORD=postgres psql -X -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --single-transaction \
            -f "$WORK/unpacked/cwl-backup/schema.sql" \
            -c 'SET session_replication_role = replica;' \
            -f "$WORK/unpacked/cwl-backup/auth-data.sql" \
            -f "$WORK/unpacked/cwl-backup/data-local.sql" \
            -c 'SET session_replication_role = origin;' \
            >"$WORK/restore.log" 2>&1; then
            # Emit a sanitized SQLSTATE and SQL file only; never print raw database errors.
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['WORK']) / 'restore.log').read_text(errors='replace')
          match = re.search(
              r'psql:.*?/(roles-local|roles|schema|auth-data|data-local|data)\.sql:(\d+):\s*(?:ERROR|FATAL):\s*([A-Z0-9]{5})',
              log, re.I)
          if match:
              filename, error_line, sqlstate = match.group(1), int(match.group(2)), match.group(3)
              print(f'::error::Restore failed in {filename}.sql line {error_line}; SQLSTATE {sqlstate}.')
              # Only print safe SQL identifiers, never raw SQL, unique-key values, or rows.
              for field in ('SCHEMA NAME', 'TABLE NAME', 'CONSTRAINT NAME'):
                  found = re.search(r'\b' + field + r':\s*([A-Za-z_][A-Za-z0-9_]*)', log)
                  if found:
                      print(f'{field}: {found.group(1)}')
              if filename in ('data', 'data-local', 'auth-data'):
                  sql_lines = (Path(os.environ['WORK']) / 'unpacked/cwl-backup' /
                               (filename + '.sql')).read_text(errors='replace').splitlines()
                  copy_header = re.compile(
                      r'^COPY\s+((?:"?[A-Za-z_][A-Za-z_0-9]*"?\.)?"?[A-Za-z_][A-Za-z_0-9]*"?)\s*\(.*\)\s+FROM\s+stdin;\s*$',
                      re.IGNORECASE)
                  active_table = None
                  start = None
                  for i, sql_line in enumerate(sql_lines[:error_line], 1):
                      header = copy_header.match(sql_line)
                      if header:
                          active_table, start = header.group(1).replace('"', ''), i
                      elif sql_line == r'\.' and i < error_line:
                          active_table, start = None, None
                  if active_table is not None:
                      print(f'Import COPY section: {active_table}, header line {start}.')
                  else:
                      print('No active COPY section found at failure line.')
          else:
              code = re.search(r'(?:ERROR|FATAL):\s*([A-Z0-9]{5})', log, re.I)
              print(f'::error::Restore failed; SQLSTATE {code.group(1) if code else "unavailable"}. Private SQL log was not published.')
          PY
            exit 1
          fi
          echo 'All SQL dumps restored without errors.'

      - name: Compare recovered row counts and RLS with backup
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['WORK']) / 'unpacked/cwl-backup'
          counts = {}
          pattern = re.compile(r'^COPY\s+(?:"?(public|auth)"?)\.(?:"?([a-zA-Z_][\w]*)"?)\s*\(', re.I)
          for filename in ('data.sql', 'auth-data.sql'):
              active = None
              for line in (root / filename).open(encoding='utf-8'):
                  if active:
                      if line.rstrip('\r\n') == r'\.':
                          active = None
                      else:
                          counts[active] += 1
                  else:
                      found = pattern.match(line)
                      if found:
                          active = f'{found.group(1)}.{found.group(2)}'
                          counts[active] = 0
              if active:
                  raise SystemExit(f'Incomplete COPY section in {filename}')
          tables = ['auth.users', 'public.cwl_clans', 'public.cwl_clan_memberships',
                    'public.cwl_cloud_profiles', 'public.cwl_change_events',
                    'public.cwl_profile_snapshots']
          def sql(query):
              p = subprocess.run(['psql', '-X', '-qAt', '-h', '127.0.0.1', '-p', '54322',
                                  '-U', 'postgres', '-d', 'postgres', '-v', 'ON_ERROR_STOP=1',
                                  '-c', query], text=True, capture_output=True)
              if p.returncode:
                  raise SystemExit('A restored table is unavailable or cannot be queried.')
              return p.stdout.strip()
          for table in tables:
              if table not in counts:
                  raise SystemExit(f'Backup missing data section for {table}')
              actual = int(sql(f'SELECT count(*) FROM {table};'))
              expected = counts[table]
              if actual != expected:
                  raise SystemExit(f'Row mismatch for {table}: expected {expected}, got {actual}')
              print(f'{table}: {actual} rows, verified')
          if counts['auth.users'] < 1:
              raise SystemExit('No auth users found in the backup.')
          for table in tables[1:]:
              name = table.split('.')[1]
              enabled = sql("SELECT c.relrowsecurity FROM pg_class c JOIN pg_namespace n "
                            "ON n.oid = c.relnamespace WHERE n.nspname = 'public' "
                            f"AND c.relname = '{name}';")
              if enabled != 't':
                  raise SystemExit(f'RLS disabled after restore: {table}')
          print('PASS: restored row counts and RLS match the encrypted backup.')
          PY

      - name: Remove disposable database and decrypted files
        if: always()
        shell: bash
        run: |
          if [[ -d "$WORK/local/supabase" ]]; then
            (cd "$WORK/local" && supabase stop --no-backup) || true
          fi
          rm -rf "$WORK"
